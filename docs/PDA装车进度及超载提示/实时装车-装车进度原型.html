<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>实时装车 - 装车进度原型</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
      background: #e8e8e8;
      color: #111;
      padding: 12px;
    }
    .review-bar {
      width: 307px;
      margin: 0 auto 10px;
      background: #fff;
      border: 1px solid #ccc;
      padding: 8px;
      font-size: 12px;
      line-height: 1.5;
    }
    .review-bar strong { display: block; margin-bottom: 4px; }
    .review-bar .hint {
      color: #666;
      font-size: 11px;
      margin-bottom: 6px;
    }
    .review-bar .row { margin-bottom: 6px; }
    .review-bar .row:last-child { margin-bottom: 0; }
    .review-bar .lab {
      font-size: 11px;
      color: #555;
      margin-bottom: 4px;
    }
    .review-bar .btns { display: flex; flex-wrap: wrap; gap: 6px; }
    .review-bar button {
      font-size: 11px;
      padding: 5px 7px;
      border: 1px solid #999;
      background: #f5f5f5;
      border-radius: 2px;
      cursor: pointer;
    }
    .review-bar button.active {
      background: #5b2c91;
      color: #fff;
      border-color: #5b2c91;
    }
    .review-bar button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .phone {
      width: 307px;
      height: 410px;
      margin: 0 auto;
      background: #f0f0f0;
      border: 1px solid #999;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .phone-body {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .nav {
      flex: 0 0 28px;
      background: #5b2c91;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      font-size: 13px;
      font-weight: 600;
    }
    .nav .side { width: 72px; font-size: 11px; font-weight: 400; }
    .nav .side.right {
      text-align: right;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
    }
    .nav .scan {
      width: 14px; height: 14px; border: 1px solid #fff; border-radius: 1px;
      display: inline-block;
    }
    .toolbar {
      flex: 0 0 auto;
      display: flex;
      gap: 3px;
      padding: 4px;
      background: #fff;
      align-items: center;
      border-bottom: 1px solid #ddd;
    }
    .toolbar input {
      flex: 1;
      min-width: 0;
      height: 22px;
      border: 1px solid #ccc;
      padding: 0 4px;
      font-size: 11px;
    }
    .toolbar .tbtn {
      height: 22px;
      padding: 0 4px;
      border: 1px solid #bbb;
      background: linear-gradient(#fafafa, #e0e0e0);
      font-size: 10px;
      white-space: nowrap;
    }
    .toolbar .tbtn.disabled { color: #aaa; }
    .table-wrap {
      flex: 1 1 auto;
      min-height: 0;
      background: #fff;
      overflow: auto;
      border-bottom: 1px solid #ccc;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 9px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 2px 1px;
      text-align: center;
      white-space: nowrap;
    }
    th { background: #fafafa; font-weight: 600; }
    tr.done td { background: #c8e6c9; }
    .tag-must { background: #f8bbd0; color: #ad1457; padding: 0 2px; }
    .tag-ok { background: #b3e5fc; color: #0277bd; padding: 0 2px; }

    .panel {
      flex: 0 0 auto;
      background: #f5f5f5;
      padding: 4px 4px 2px;
      border-top: 1px solid #ddd;
    }
    .panel-main {
      display: flex;
      gap: 6px;
      align-items: stretch;
    }
    .panel-left {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      line-height: 1.45;
      padding-top: 2px;
    }
    .panel-left .lab { color: #222; }
    .panel-left .big {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.1;
      margin: 1px 0 4px;
    }
    .metric {
      margin: 1px 0;
      font-size: 12px;
    }
    .metric b { font-weight: 700; }
    .metric .pct {
      font-weight: 700;
      color: #222;
    }
    .metric.tip .pct { color: #ef6c00; }
    .metric.force .pct { color: #b71c1c; }
    .metric.miss {
      color: #757575;
      font-size: 11px;
      font-weight: 600;
    }
    .lock-tip {
      display: none;
      margin-top: 3px;
      font-size: 11px;
      color: #b71c1c;
      font-weight: 600;
    }
    .lock-tip.show { display: block; }

    .panel-right {
      width: 78px;
      flex: 0 0 78px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 3px;
    }
    .tickets {
      font-size: 11px;
      text-align: center;
      line-height: 1.2;
      padding: 1px 0;
    }
    .gbtn {
      height: 24px;
      border: 1px solid #9e9e9e;
      border-radius: 4px;
      background: linear-gradient(#f7f7f7, #cfcfcf);
      font-size: 12px;
      color: #111;
    }
    .rbtn {
      height: 24px;
      border: 1px solid #b71c1c;
      border-radius: 4px;
      background: #e53935;
      font-size: 12px;
      color: #fff;
      font-weight: 600;
    }
    .settle {
      margin-top: 3px;
      font-size: 11px;
      line-height: 1.3;
      padding: 0 2px 2px;
    }
    .actions-bottom {
      flex: 0 0 40px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 4px;
      padding: 3px 4px 4px;
      background: #ebebeb;
      border-top: 1px solid #ccc;
    }
    .actions-bottom button {
      height: 100%;
      font-size: 11px;
      line-height: 1.15;
      border: 1px solid #9e9e9e;
      border-radius: 4px;
      background: linear-gradient(#f7f7f7, #cfcfcf);
      color: #111;
      padding: 0 2px;
    }

    .mask {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 20;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .mask.show { display: flex; }
    .dialog {
      width: 100%;
      background: #fff;
      border-radius: 4px;
      overflow: hidden;
    }
    .dialog .body {
      padding: 14px 12px 10px;
      font-size: 13px;
      line-height: 1.45;
    }
    .dialog .foot { border-top: 1px solid #e0e0e0; display: flex; }
    .dialog .foot button {
      flex: 1;
      height: 36px;
      border: none;
      background: #fff;
      color: #5b2c91;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="review-bar">
    <strong>评审切换（非线上控件）</strong>
    <div class="hint" id="paramHint">干线演示：剩余 5 / 3 / 1 吨提示；达 120% 禁止装车</div>

    <div class="row">
      <div class="lab">操作类型 / 菜单</div>
      <div class="btns" id="modeBtns">
        <button type="button" class="active" data-mode="trunk">干线·实时装车</button>
        <button type="button" data-mode="outlet">网点装车</button>
        <button type="button" data-mode="flow">流水装车</button>
      </div>
    </div>

    <div class="row" id="comboRow">
      <div class="lab">策略组合（两项独立开关）</div>
      <div class="btns" id="comboBtns">
        <button type="button" class="active" data-combo="both">提示+拦截</button>
        <button type="button" data-combo="tip">只开提示</button>
        <button type="button" data-combo="force">只开拦截</button>
        <button type="button" data-combo="none">都关</button>
      </div>
    </div>

    <div class="row">
      <div class="lab" id="levelLab">剩余可装提示 / 禁止装车</div>
      <div class="btns" id="levelBtns"></div>
    </div>

    <div class="row">
      <div class="lab">缺额定</div>
      <div class="btns" id="missBtns">
        <button type="button" data-level="missW">缺额定重量</button>
        <button type="button" data-level="missV">缺额定体积</button>
      </div>
    </div>
  </div>

  <div class="phone" id="app">
    <div class="phone-body">
      <div class="nav">
        <div class="side">←</div>
        <div id="navTitle">实时装车</div>
        <div class="side right">上传日志 <span class="scan" aria-hidden="true"></span></div>
      </div>

      <div class="toolbar">
        <input type="text" value="沧衡分拨" readonly />
        <button class="tbtn disabled" type="button">单号撤销</button>
        <button class="tbtn" type="button">刷新</button>
        <button class="tbtn" type="button">团队</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>运单号</th>
              <th>预配</th>
              <th>VIP</th>
              <th>开单</th>
              <th>库存</th>
              <th>扫/传</th>
              <th>总扫描</th>
            </tr>
          </thead>
          <tbody>
            <tr class="done">
              <td>ZY860062072036</td>
              <td>非预配</td>
              <td>否</td>
              <td>2</td>
              <td>0</td>
              <td>2/2</td>
              <td>2</td>
            </tr>
            <tr>
              <td>302235340673</td>
              <td><span class="tag-must">必装</span></td>
              <td>否</td>
              <td>2</td>
              <td>1</td>
              <td>0/0</td>
              <td>0</td>
            </tr>
            <tr>
              <td>800213496785</td>
              <td><span class="tag-ok">可装</span></td>
              <td>否</td>
              <td>2</td>
              <td>1</td>
              <td>0/0</td>
              <td>0</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="panel">
        <div class="panel-main">
          <div class="panel-left">
            <div class="lab">预配实际重量：</div>
            <div class="big">9626.53</div>
            <div class="metric" id="rowWeight">额定重量：<b id="ratedW">27000</b> <span class="pct" id="pctW">(72%)</span></div>
            <div class="metric" id="rowVolume">额定体积：<b id="ratedV">130</b> <span class="pct" id="pctV">(45%)</span></div>
            <div class="lock-tip" id="lockTip">已禁止装车扫描</div>
          </div>
          <div class="panel-right">
            <div class="tickets">装票/件:1/2</div>
            <button class="gbtn" type="button">无头件</button>
            <button class="rbtn" type="button">严重破损</button>
            <button class="gbtn" type="button">发车</button>
          </div>
        </div>
        <div class="settle">已上传操作结算重量体积：<b>846.00/2.76</b></div>
      </div>
    </div>

    <div class="actions-bottom">
      <button type="button">破损上报</button>
      <button type="button">切换<br>交接单</button>
      <button type="button">库存核对</button>
      <button type="button">漏扫查询</button>
    </div>

    <div class="mask" id="mask" aria-hidden="true">
      <div class="dialog" role="dialog" aria-modal="true">
        <div class="body" id="dialogBody"></div>
        <div class="foot">
          <button type="button" id="btnKnow">知道了</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* 额定重量 27000kg=27吨，用于演示剩余吨 → 重量% */
    var RATED_KG = 27000;
    var RATED_TON = 27;

    var MODES = {
      trunk: {
        title: '实时装车',
        tips: [5, 3, 1],
        canForce: true
      },
      outlet: {
        title: '网点装车',
        tips: [3, 1],
        canForce: false
      },
      flow: {
        title: '流水装车',
        tips: [5, 3, 1],
        canForce: true,
        flowOnly: true
      }
    };

    var mode = 'trunk';
    var combo = 'both';
    var level = 'safe';

    var navTitle = document.getElementById('navTitle');
    var paramHint = document.getElementById('paramHint');
    var levelLab = document.getElementById('levelLab');
    var levelBtns = document.getElementById('levelBtns');
    var rowWeight = document.getElementById('rowWeight');
    var rowVolume = document.getElementById('rowVolume');
    var ratedW = document.getElementById('ratedW');
    var ratedV = document.getElementById('ratedV');
    var pctW = document.getElementById('pctW');
    var pctV = document.getElementById('pctV');
    var lockTip = document.getElementById('lockTip');
    var mask = document.getElementById('mask');
    var dialogBody = document.getElementById('dialogBody');

    function remainToWeightPct(remainTon) {
      var loaded = RATED_TON - remainTon;
      if (loaded < 0) loaded = 0;
      return Math.floor((loaded / RATED_TON) * 100);
    }

    function showDialog(text) {
      dialogBody.textContent = text;
      mask.classList.add('show');
      mask.setAttribute('aria-hidden', 'false');
    }

    function hideDialog() {
      mask.classList.remove('show');
      mask.setAttribute('aria-hidden', 'true');
    }

    function currentFlags() {
      var m = MODES[mode];
      if (m.flowOnly) {
        return { tip: false, force: false, hint: '流水装车：只展示双百分比，不提示、不拦截' };
      }
      var tip = combo === 'both' || combo === 'tip';
      var force = combo === 'both' || combo === 'force';
      var hint = '';
      if (combo === 'both') hint = (mode === 'outlet' ? '网点' : '干线') + '：开提示 + 开拦截';
      if (combo === 'tip') hint = '只开剩余吨位提示，不拦截';
      if (combo === 'force') hint = '只开强制拦截（干线常用 120%），不弹剩余吨提示';
      if (combo === 'none') hint = '两项都关：只展示双百分比';
      return { tip: tip, force: force, hint: hint };
    }

    function rebuildLevelBtns() {
      var m = MODES[mode];
      var f = currentFlags();
      var html = '<button type="button" class="active" data-level="safe">安全</button>';
      m.tips.forEach(function (t) {
        html += '<button type="button" data-level="t' + t + '">剩余≤' + t + '吨</button>';
      });
      html += '<button type="button" data-level="force">禁止装车120%</button>';
      levelBtns.innerHTML = html;
      if (m.flowOnly) {
        levelLab.textContent = '剩余可装（流水只展示，点了也不弹窗）';
      } else if (f.tip && f.force) {
        levelLab.textContent = '剩余可装提示 / 禁止装车';
      } else if (f.tip) {
        levelLab.textContent = '剩余可装提示（拦截已关）';
      } else if (f.force) {
        levelLab.textContent = '禁止装车（提示已关）';
      } else {
        levelLab.textContent = '两项都关，点档位不弹窗不锁扫';
      }

      Array.prototype.forEach.call(levelBtns.querySelectorAll('button'), function (b) {
        b.addEventListener('click', function () {
          clearMissActive();
          Array.prototype.forEach.call(levelBtns.querySelectorAll('button'), function (x) {
            x.classList.remove('active');
          });
          b.classList.add('active');
          level = b.getAttribute('data-level');
          render();
        });
      });
    }

    function clearMissActive() {
      Array.prototype.forEach.call(document.querySelectorAll('#missBtns button'), function (b) {
        b.classList.remove('active');
      });
    }

    function clearLevelActive() {
      Array.prototype.forEach.call(levelBtns.querySelectorAll('button'), function (b) {
        b.classList.remove('active');
      });
    }

    function setMetricNormal(weightPct, volumePct) {
      rowWeight.className = 'metric';
      rowVolume.className = 'metric';
      ratedW.textContent = '27000';
      ratedV.textContent = '130';
      pctW.style.display = '';
      pctV.style.display = '';
      pctW.textContent = '(' + weightPct + '%)';
      pctV.textContent = '(' + volumePct + '%)';
    }

    function render() {
      var m = MODES[mode];
      var f = currentFlags();
      navTitle.textContent = m.title;
      paramHint.textContent = f.hint;
      hideDialog();
      lockTip.classList.remove('show');
      document.getElementById('comboRow').style.display = m.flowOnly ? 'none' : '';

      if (level === 'missW') {
        rowWeight.className = 'metric miss';
        rowWeight.innerHTML = '额定重量：未获取到额定重量';
        rowVolume.className = 'metric';
        rowVolume.innerHTML = '额定体积：<b>130</b> <span class="pct">(45%)</span>';
        return;
      }
      if (level === 'missV') {
        rowWeight.className = 'metric';
        rowWeight.innerHTML = '额定重量：<b>27000</b> <span class="pct">(72%)</span>';
        rowVolume.className = 'metric miss';
        rowVolume.innerHTML = '额定体积：未获取到额定体积';
        return;
      }

      /* 重建 metric 节点（缺额定会改 innerHTML） */
      rowWeight.innerHTML = '额定重量：<b id="ratedW">27000</b> <span class="pct" id="pctW">(72%)</span>';
      rowVolume.innerHTML = '额定体积：<b id="ratedV">130</b> <span class="pct" id="pctV">(45%)</span>';
      ratedW = document.getElementById('ratedW');
      ratedV = document.getElementById('ratedV');
      pctW = document.getElementById('pctW');
      pctV = document.getElementById('pctV');

      if (level === 'safe') {
        setMetricNormal(72, 45);
        return;
      }

      if (level === 'force') {
        setMetricNormal(120, 88);
        rowWeight.classList.add('force');
        if (f.force) {
          lockTip.classList.add('show');
          showDialog('车辆已超额定载重 120%，禁止继续装车');
        }
        return;
      }

      if (level.indexOf('t') === 0) {
        var remain = parseInt(level.slice(1), 10);
        var wPct = remainToWeightPct(remain);
        var vPct = Math.max(30, Math.min(95, 100 - remain * 8));
        setMetricNormal(wPct, vPct);
        rowWeight.classList.add('tip');
        if (f.tip) {
          showDialog('剩余可装 ' + remain + ' 吨，请注意控制货量。');
        }
      }
    }

    Array.prototype.forEach.call(document.querySelectorAll('#modeBtns button'), function (b) {
      b.addEventListener('click', function () {
        Array.prototype.forEach.call(document.querySelectorAll('#modeBtns button'), function (x) {
          x.classList.remove('active');
        });
        b.classList.add('active');
        mode = b.getAttribute('data-mode');
        level = 'safe';
        rebuildLevelBtns();
        render();
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('#comboBtns button'), function (b) {
      b.addEventListener('click', function () {
        Array.prototype.forEach.call(document.querySelectorAll('#comboBtns button'), function (x) {
          x.classList.remove('active');
        });
        b.classList.add('active');
        combo = b.getAttribute('data-combo');
        level = 'safe';
        rebuildLevelBtns();
        render();
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('#missBtns button'), function (b) {
      b.addEventListener('click', function () {
        clearLevelActive();
        clearMissActive();
        b.classList.add('active');
        level = b.getAttribute('data-level');
        render();
      });
    });

    document.getElementById('btnKnow').addEventListener('click', hideDialog);

    rebuildLevelBtns();
    render();
  </script>
</body>
</html>
