<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>装车预警配置维护</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #1890ff;
      --primary-hover: #40a9ff;
      --header-blue: #0659d9;
      --sidebar-bg: #001529;
      --sidebar-sub: #000c17;
      --sidebar-text: rgba(255,255,255,.65);
      --sidebar-text-active: #fff;
      --bg: #f0f2f5;
      --card: #fff;
      --border: #e8e8e8;
      --text: rgba(0,0,0,.85);
      --text-secondary: rgba(0,0,0,.45);
      --sidebar-width: 200px;
      --sidebar-collapsed: 64px;
      --header-height: 48px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
      overflow: hidden;
    }

    .layout { display: flex; flex-direction: column; height: 100vh; }

    /* 顶部整栏：左品牌 + 右蓝底标签栏 */
    .top-header {
      height: var(--header-height);
      display: flex;
      flex-shrink: 0;
      z-index: 10;
    }
    .brand-area {
      width: var(--sidebar-width);
      background: var(--sidebar-bg);
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-size: 15px;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
      transition: width .2s;
      letter-spacing: .5px;
    }
    .layout.sidebar-collapsed .brand-area {
      width: var(--sidebar-collapsed);
      padding: 0 8px;
      justify-content: center;
      font-size: 12px;
    }
    .layout.sidebar-collapsed .brand-area .brand-full { display: none; }
    .layout.sidebar-collapsed .brand-area .brand-short { display: inline; }
    .brand-area .brand-short { display: none; }

    .top-tabs {
      flex: 1;
      min-width: 0;
      height: 100%;
      background: var(--header-blue);
      display: flex;
      align-items: flex-end;
      padding: 0 8px 0 4px;
    }
    .top-tabs .collapse-btn,
    .top-tabs .home-btn {
      width: 36px;
      height: 36px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      border-radius: 4px;
      font-size: 18px;
      flex-shrink: 0;
      opacity: .95;
    }
    .top-tabs .collapse-btn:hover,
    .top-tabs .home-btn:hover { background: rgba(255,255,255,.15); }

    .page-tabs {
      display: flex;
      align-items: flex-end;
      flex: 1;
      overflow-x: auto;
      gap: 4px;
      padding: 0 4px;
      height: 100%;
    }
    .page-tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      height: 36px;
      border-radius: 6px 6px 0 0;
      color: rgba(255,255,255,.95);
      cursor: pointer;
      white-space: nowrap;
      font-size: 13px;
      background: rgba(255,255,255,.18);
    }
    .page-tab:hover { background: rgba(255,255,255,.28); }
    .page-tab.active {
      background: #fff;
      color: var(--text);
      font-weight: 500;
    }
    .page-tab .tab-close {
      font-size: 14px;
      line-height: 1;
      opacity: .7;
      margin-left: 2px;
    }
    .page-tab.active .tab-close { opacity: .45; color: var(--text-secondary); }
    .page-tab .tab-close:hover { opacity: 1; color: #ff4d4f; }

    .top-right {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 8px 6px 12px;
      color: #fff;
      flex-shrink: 0;
      align-self: flex-end;
      height: 42px;
    }
    .top-right .icon-btn {
      position: relative;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 4px;
      font-size: 16px;
      opacity: .95;
    }
    .top-right .icon-btn:hover { background: rgba(255,255,255,.15); }
    .top-right .icon-btn .badge {
      position: absolute;
      top: 2px;
      right: 2px;
      min-width: 14px;
      height: 14px;
      padding: 0 3px;
      border-radius: 7px;
      background: #ff4d4f;
      color: #fff;
      font-size: 10px;
      line-height: 14px;
      text-align: center;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 8px;
      padding: 0 4px 0 8px;
      cursor: pointer;
      border-radius: 4px;
      height: 32px;
    }
    .user-info:hover { background: rgba(255,255,255,.15); }
    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #722ed1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #fff;
      flex-shrink: 0;
    }
    .user-name { font-size: 13px; color: #fff; white-space: nowrap; }
    .user-arrow { font-size: 10px; opacity: .8; }

    /* 下方：侧栏 + 主内容 */
    .body-row { flex: 1; display: flex; overflow: hidden; min-height: 0; }

    .sidebar {
      width: var(--sidebar-width);
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width .2s;
      overflow: hidden;
    }
    .layout.sidebar-collapsed .sidebar { width: var(--sidebar-collapsed); }

    .sidebar-menu { flex: 1; overflow-y: auto; padding: 8px 0; }

    .menu-item {
      display: flex;
      align-items: center;
      padding: 0 16px;
      height: 40px;
      color: var(--sidebar-text);
      cursor: pointer;
      white-space: nowrap;
      gap: 10px;
      font-size: 14px;
    }
    .menu-item:hover { color: var(--sidebar-text-active); }
    .menu-item.active { background: var(--primary); color: #fff; }
    .menu-item .menu-icon { width: 16px; text-align: center; flex-shrink: 0; opacity: .75; }
    .menu-item .menu-arrow { margin-left: auto; font-size: 10px; opacity: .5; }
    .layout.sidebar-collapsed .menu-label,
    .layout.sidebar-collapsed .menu-arrow { display: none; }

    .menu-sub { background: var(--sidebar-sub); }
    .menu-sub .menu-item { padding-left: 48px; height: 36px; font-size: 13px; }
    .layout.sidebar-collapsed .menu-sub { display: none; }

    .main-wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

    /* 主内容区：卡片撑满可视高度，分页贴底 */
    .content-area {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }
    .content-card {
      background: var(--card);
      border-radius: 4px;
      padding: 16px;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: hidden;
    }

    /* 1. 筛选条件区：名称左+控件右；3 列网格；重置/查询与最后一行底对齐 */
    .filter-area {
      display: flex;
      align-items: flex-end;
      gap: 16px;
    }
    .filter-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px 24px;
      align-items: center;
    }
    .filter-item {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .filter-item .filter-label {
      flex: 0 0 96px;
      text-align: right;
      font-size: 14px;
      color: var(--text);
      white-space: nowrap;
    }
    .filter-item .filter-control-wrap {
      flex: 1;
      min-width: 0;
    }
    .filter-item .filter-control-wrap > .filter-control,
    .filter-item .filter-control-wrap > .select-wrap,
    .filter-item .filter-control-wrap > .date-range {
      width: 100%;
    }
    .filter-control {
      width: 100%;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0 11px;
      font-size: 14px;
      color: var(--text);
      background: #fff;
      outline: none;
    }
    .filter-control:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(24,144,255,.2); }
    .filter-control::placeholder { color: #bfbfbf; }

    .select-wrap { position: relative; }
    .select-wrap .filter-control {
      appearance: none;
      padding-right: 28px;
      cursor: pointer;
      color: var(--text-secondary);
    }
    .select-wrap::after {
      content: "▼";
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 10px;
      color: var(--text-secondary);
      pointer-events: none;
    }

    .date-range { display: flex; align-items: center; gap: 8px; }
    .date-range .filter-control { flex: 1; min-width: 0; }
    .date-range .sep { color: var(--text-secondary); font-size: 13px; flex-shrink: 0; }

    .filter-actions { display: flex; gap: 8px; flex-shrink: 0; padding-bottom: 1px; }
    .btn {
      height: 32px;
      padding: 0 16px;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      white-space: nowrap;
    }
    .btn:hover { color: var(--primary); border-color: var(--primary); }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); color: #fff; }

    /* 2. 标签切换区 */
    .content-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); }
    .content-tab {
      padding: 8px 16px;
      cursor: pointer;
      color: var(--text);
      font-size: 14px;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .content-tab:hover { color: var(--primary); }
    .content-tab.active { color: var(--primary); border-bottom-color: var(--primary); }

    /* 3. 操作按钮区 */
    .action-bar { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-action {
      height: 32px;
      padding: 0 15px;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
    }
    .btn-action.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-action:hover { opacity: .85; }

    /* 4. 数据列表区：占满剩余高度，分页始终在底部 */
    .table-area {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .table-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
    }
    .data-table { width: max-content; min-width: 100%; border-collapse: collapse; font-size: 14px; }
    .data-table th,
    .data-table td { border: 1px solid var(--border); padding: 10px 12px; text-align: center; }
    .data-table th { background: #fafafa; font-weight: 500; color: var(--text); white-space: nowrap; }
    .data-table tbody tr:hover { background: #fafafa; }
    .col-checkbox { width: 48px; text-align: center !important; }
    .col-checkbox input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--primary); }
    .cell-placeholder { color: var(--text-secondary); }

    /* 分页：贴列表区底部固定展示 */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-top: auto;
      padding-top: 16px;
      flex-shrink: 0;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .pagination .total { margin-right: 8px; }
    .page-btn {
      min-width: 32px; height: 32px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      display: flex; align-items: center; justify-content: center;
      padding: 0 8px;
    }
    .page-btn:hover { color: var(--primary); border-color: var(--primary); }
    .page-btn.active { color: var(--primary); border-color: var(--primary); }
    .page-btn.disabled { opacity: .4; cursor: not-allowed; }
    .page-jump { display: flex; align-items: center; gap: 6px; margin-left: 8px; }
    .page-jump input {
      width: 48px; height: 32px;
      border: 1px solid var(--border);
      border-radius: 4px;
      text-align: center;
      font-size: 13px;
      outline: none;
    }
  
    .modal-mask {
      position: fixed; inset: 0; z-index: 1000;
      display: none; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, .45);
    }
    .modal-mask.open { display: flex; }
    .modal {
      width: 720px; max-height: 90vh; background: #fff; border-radius: 4px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .2);
      display: flex; flex-direction: column;
    }
    .modal.confirm { width: 420px; }
    .modal-header {
      height: 48px; padding: 0 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      font-size: 16px; font-weight: 500; flex-shrink: 0;
    }
    .modal-close { border: 0; background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 18px; }
    .modal-body { padding: 18px 24px 8px; overflow-y: auto; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); flex-shrink: 0; }
    .form-item {
      display: flex; flex-direction: row; align-items: center; gap: 8px;
      min-width: 0; margin-bottom: 14px;
    }
    .form-item.align-start { align-items: flex-start; }
    .form-item .form-label {
      flex: 0 0 128px; width: 128px; text-align: right; padding-top: 6px;
      white-space: nowrap; color: var(--text);
    }
    .form-label.required::before { content: "*"; color: #ff4d4f; margin-right: 4px; }
    .form-field { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .form-control {
      width: 100%; height: 32px; border: 1px solid var(--border); border-radius: 4px;
      padding: 0 11px; outline: none; font-size: 14px; background: #fff;
    }
    .form-control.w-sm {
      width: 200px;
      max-width: 100%;
    }
    .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(24,144,255,.2); }
    .form-control:disabled, .form-control[readonly] { background: #f5f5f5; color: var(--text-secondary); }
    .check-group { display: flex; flex-wrap: wrap; gap: 8px 16px; padding-top: 4px; }
    .check-group label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
    .tip-rows { display: flex; flex-direction: column; gap: 8px; }
    .tip-row {
      display: flex; align-items: center; gap: 8px;
    }
    .tip-row .tip-label {
      width: 72px; flex: 0 0 72px; text-align: left;
      color: var(--text-secondary); font-size: 13px;
    }
    .tip-row .form-control { width: 200px; flex: 0 0 200px; }
    .tip-row .unit { color: var(--text-secondary); font-size: 13px; }
    .confirm-body { padding: 28px 24px 12px; line-height: 1.6; }
    .data-table { width: max-content; min-width: 100%; }
    .data-table th { white-space: nowrap; }
    .data-table td { white-space: nowrap; }

  </style>
</head>
<body>

<div class="layout" id="layout">
  <header class="top-header">
    <div class="brand-area">
      <span class="brand-full">数智分拨 | DLC</span>
      <span class="brand-short">DLC</span>
    </div>
    <div class="top-tabs">
      <div class="collapse-btn" id="sidebarToggle" title="折叠/展开">☰</div>
      <div class="home-btn" title="首页">⌂</div>
      <div class="page-tabs" id="pageTabs">
        <div class="page-tab active">装车预警配置维护 <span class="tab-close">×</span></div>
      </div>
      <div class="top-right">
        <span class="icon-btn" title="文档">📄</span>
        <span class="icon-btn" title="下载">⬇</span>
        <span class="icon-btn" title="搜索">🔍</span>
        <span class="icon-btn" title="通知">🔔<span class="badge">3</span></span>
        <div class="user-info" title="用户">
          <div class="avatar">U</div>
          <span class="user-name">sysadmin</span>
          <span class="user-arrow">▼</span>
        </div>
      </div>
    </div>
  </header>

  <div class="body-row">
    <aside class="sidebar" id="sidebar">
      <nav class="sidebar-menu">
        <div class="menu-item"><span class="menu-icon">⌂</span><span class="menu-label">首页</span></div>
        <div class="menu-item active">
          <span class="menu-icon">⚙</span><span class="menu-label">装车管理</span><span class="menu-arrow">▼</span>
        </div>
        <div class="menu-sub">
          <div class="menu-item">装车预警配置维护</div>
        </div>
      </nav>
    </aside>

    <div class="main-wrapper">
    <main class="content-area">
      <div class="content-card">

        <section class="filter-area">
          <div class="filter-grid">
            <div class="filter-item">
              <span class="filter-label">配置范围</span>
              <div class="filter-control-wrap">
                <div class="select-wrap">
                  <select class="filter-control" id="fScope">
                    <option value="">全部</option>
                    <option>全国</option>
                    <option>分拨</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="filter-item">
              <span class="filter-label">分拨中心</span>
              <div class="filter-control-wrap">
                <input class="filter-control" type="text" placeholder="分拨中心" id="fSite" />
              </div>
            </div>
            <div class="filter-item">
              <span class="filter-label">操作类型</span>
              <div class="filter-control-wrap">
                <div class="select-wrap">
                  <select class="filter-control" id="fOpType">
                    <option value="">全部</option>
                    <option>干线</option>
                    <option>网点</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="filter-item">
              <span class="filter-label">开启剩余吨位提示</span>
              <div class="filter-control-wrap">
                <div class="select-wrap">
                  <select class="filter-control" id="fTipOn">
                    <option value="">全部</option>
                    <option>是</option>
                    <option>否</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="filter-item">
              <span class="filter-label">开启强制拦截</span>
              <div class="filter-control-wrap">
                <div class="select-wrap">
                  <select class="filter-control" id="fForce">
                    <option value="">全部</option>
                    <option>是</option>
                    <option>否</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
          <div class="filter-actions">
            <button class="btn" type="button" id="btnReset">重置</button>
            <button class="btn btn-primary" type="button" id="btnQuery">查询</button>
          </div>
        </section>

        <section class="action-bar">
          <button class="btn-action primary" type="button" id="btnAdd">新增</button>
          <button class="btn-action" type="button" id="btnEdit">编辑</button>
          <button class="btn-action" type="button" id="btnDelete">删除</button>
        </section>

        <section class="table-area">
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr>
                  <th class="col-checkbox"><input type="checkbox" id="checkAll" /></th>
                  <th>配置范围</th>
                  <th>分拨中心</th>
                  <th>操作类型</th>
                  <th>适用分拨类型</th>
                  <th>开启剩余吨位提示</th>
                  <th>提示次数</th>
                  <th>提示吨位</th>
                  <th>开启强制拦截</th>
                  <th>强制拦截%</th>
                  <th>强制拦截吨</th>
                  <th>创建人</th>
                  <th>创建时间</th>
                  <th>修改人</th>
                  <th>修改时间</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
          <div class="pagination">
            <span class="total" id="totalText">共 0 条</span>
            <button class="page-btn disabled" type="button">&lt;</button>
            <button class="page-btn active" type="button">1</button>
            <button class="page-btn disabled" type="button">&gt;</button>
            <div class="page-jump">跳至 <input type="text" value="1" /> 页</div>
          </div>
        </section>

      </div>
    </main>
  </div>
  </div>
</div>

<div class="modal-mask" id="editMask">
  <div class="modal">
    <div class="modal-header">
      <span id="editTitle">新增</span>
      <button type="button" class="modal-close" id="editClose">×</button>
    </div>
    <div class="modal-body">
      <div class="form-item">
        <label class="form-label required">配置范围</label>
        <div class="form-field">
          <select class="form-control w-sm" id="mScope">
            <option value="">请选择</option>
            <option>全国</option>
            <option>分拨</option>
          </select>
        </div>
      </div>
      <div class="form-item" id="rowSite" style="display:none;">
        <label class="form-label required">分拨中心</label>
        <div class="form-field">
          <input class="form-control w-sm" type="text" id="mSite" placeholder="请选择分拨中心" />
        </div>
      </div>
      <div class="form-item">
        <label class="form-label required">操作类型</label>
        <div class="form-field">
          <select class="form-control w-sm" id="mOpType">
            <option value="">请选择</option>
            <option>干线</option>
            <option>网点</option>
          </select>
        </div>
      </div>
      <div class="form-item align-start" id="rowTypes" style="display:none;">
        <label class="form-label required">适用分拨类型</label>
        <div class="form-field">
          <div class="check-group" id="mTypes">
            <label><input type="checkbox" value="直营分拨中心" />直营分拨中心</label>
            <label><input type="checkbox" value="非直营分拨中心" />非直营分拨中心</label>
            <label><input type="checkbox" value="服务站" />服务站</label>
            <label><input type="checkbox" value="直营集配站" />直营集配站</label>
            <label><input type="checkbox" value="非直营集配站" />非直营集配站</label>
          </div>
        </div>
      </div>
      <div class="form-item">
        <label class="form-label required">开启剩余吨位提示</label>
        <div class="form-field">
          <select class="form-control w-sm" id="mTipOn">
            <option>否</option>
            <option>是</option>
          </select>
        </div>
      </div>
      <div class="form-item" id="rowTipCount">
        <label class="form-label required">提示次数</label>
        <div class="form-field">
          <input class="form-control w-sm" type="number" id="mTipCount" min="1" max="5" value="3" />
        </div>
      </div>
      <div class="form-item align-start" id="rowTipTons">
        <label class="form-label required">提示吨位</label>
        <div class="form-field">
          <div class="tip-rows" id="mTipRows"></div>
        </div>
      </div>
      <div class="form-item">
        <label class="form-label required">开启强制拦截</label>
        <div class="form-field">
          <select class="form-control w-sm" id="mForceOn">
            <option>否</option>
            <option>是</option>
          </select>
        </div>
      </div>
      <div class="form-item" id="rowForcePct">
        <label class="form-label required">强制拦截%</label>
        <div class="form-field">
          <input class="form-control w-sm" type="number" id="mForcePct" placeholder="如 120" />
        </div>
      </div>
      <div class="form-item" id="rowForceTon">
        <label class="form-label">强制拦截吨</label>
        <div class="form-field">
          <input class="form-control w-sm" type="number" id="mForceTon" placeholder="选填" />
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" type="button" id="editCancel">取消</button>
      <button class="btn btn-primary" type="button" id="editOk">确定</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="delMask">
  <div class="modal confirm">
    <div class="modal-header">
      <span>删除确认</span>
      <button type="button" class="modal-close" id="delClose">×</button>
    </div>
    <div class="confirm-body" id="delText">确认删除选中的配置吗？</div>
    <div class="modal-footer">
      <button class="btn" type="button" id="delCancel">取消</button>
      <button class="btn btn-primary" type="button" id="delOk">确定</button>
    </div>
  </div>
</div>

<script>
  var ALL_TYPES = ['直营分拨中心','非直营分拨中心','服务站','直营集配站','非直营集配站'];
  var rows = [
    {
      id: 1, scope: '全国', site: '-', opType: '干线',
      types: ALL_TYPES.slice(), tipOn: '是', tipCount: 3, tips: [5,3,1],
      forceOn: '是', forcePct: 120, forceTon: '',
      creator: '胡绵飞', createTime: '2026-08-12 10:00:00',
      modifier: '胡绵飞', modifyTime: '2026-08-12 10:00:00'
    },
    {
      id: 2, scope: '全国', site: '-', opType: '网点',
      types: ALL_TYPES.slice(), tipOn: '是', tipCount: 2, tips: [3,1],
      forceOn: '否', forcePct: '', forceTon: '',
      creator: '胡绵飞', createTime: '2026-08-12 10:05:00',
      modifier: '胡绵飞', modifyTime: '2026-08-12 10:05:00'
    },
    {
      id: 3, scope: '分拨', site: '沧衡分拨', opType: '干线',
      types: [], tipOn: '否', tipCount: '', tips: [],
      forceOn: '是', forcePct: 120, forceTon: '',
      creator: '张三', createTime: '2026-08-12 14:20:00',
      modifier: '李四', modifyTime: '2026-08-12 16:10:00'
    }
  ];
  var editId = null;
  var filtered = rows.slice();

  document.getElementById('sidebarToggle').addEventListener('click', function () {
    document.getElementById('layout').classList.toggle('sidebar-collapsed');
  });

  document.getElementById('checkAll').addEventListener('change', function () {
    document.querySelectorAll('.row-check').forEach(function (cb) { cb.checked = this.checked; }, this);
  });

  function typesText(arr) {
    if (!arr || !arr.length) return '-';
    if (arr.length === ALL_TYPES.length) return '全部';
    return arr.join('、');
  }

  function renderTable() {
    var tb = document.getElementById('tableBody');
    tb.innerHTML = filtered.map(function (r) {
      return '<tr data-id="' + r.id + '">' +
        '<td class="col-checkbox"><input type="checkbox" class="row-check" /></td>' +
        '<td>' + r.scope + '</td>' +
        '<td>' + r.site + '</td>' +
        '<td>' + r.opType + '</td>' +
        '<td>' + typesText(r.types) + '</td>' +
        '<td>' + r.tipOn + '</td>' +
        '<td>' + (r.tipOn === '是' ? r.tipCount : '-') + '</td>' +
        '<td>' + (r.tipOn === '是' && r.tips && r.tips.length ? r.tips.join('/') : '-') + '</td>' +
        '<td>' + r.forceOn + '</td>' +
        '<td>' + (r.forcePct === '' || r.forcePct === null ? '-' : r.forcePct) + '</td>' +
        '<td>' + (r.forceTon === '' || r.forceTon === null ? '-' : r.forceTon) + '</td>' +
        '<td>' + r.creator + '</td>' +
        '<td>' + r.createTime + '</td>' +
        '<td>' + r.modifier + '</td>' +
        '<td>' + r.modifyTime + '</td>' +
        '</tr>';
    }).join('');
    document.getElementById('totalText').textContent = '共 ' + filtered.length + ' 条';
    document.getElementById('checkAll').checked = false;
  }

  function applyFilter() {
    var scope = document.getElementById('fScope').value;
    var site = document.getElementById('fSite').value.trim();
    var op = document.getElementById('fOpType').value;
    var tipOn = document.getElementById('fTipOn').value;
    var force = document.getElementById('fForce').value;
    filtered = rows.filter(function (r) {
      if (scope && r.scope !== scope) return false;
      if (site && r.site.indexOf(site) < 0) return false;
      if (op && r.opType !== op) return false;
      if (tipOn && r.tipOn !== tipOn) return false;
      if (force && r.forceOn !== force) return false;
      return true;
    });
    renderTable();
  }

  document.getElementById('btnQuery').addEventListener('click', applyFilter);
  document.getElementById('btnReset').addEventListener('click', function () {
    document.getElementById('fScope').value = '';
    document.getElementById('fSite').value = '';
    document.getElementById('fOpType').value = '';
    document.getElementById('fTipOn').value = '';
    document.getElementById('fForce').value = '';
    applyFilter();
  });

  function syncScopeFields() {
    var scope = document.getElementById('mScope').value;
    document.getElementById('rowSite').style.display = scope === '分拨' ? '' : 'none';
    document.getElementById('rowTypes').style.display = scope === '全国' ? '' : 'none';
  }

  function syncTipFields() {
    var on = document.getElementById('mTipOn').value === '是';
    document.getElementById('rowTipCount').style.display = on ? '' : 'none';
    document.getElementById('rowTipTons').style.display = on ? '' : 'none';
  }

  function syncForceFields() {
    var on = document.getElementById('mForceOn').value === '是';
    document.getElementById('rowForcePct').style.display = on ? '' : 'none';
    document.getElementById('rowForceTon').style.display = on ? '' : 'none';
  }

  function rebuildTipRows(count, values) {
    count = Math.max(1, Math.min(5, parseInt(count, 10) || 1));
    document.getElementById('mTipCount').value = count;
    var box = document.getElementById('mTipRows');
    var html = '';
    for (var i = 0; i < count; i++) {
      var v = values && values[i] != null ? values[i] : '';
      html += '<div class="tip-row"><span class="tip-label">第' + (i + 1) + '档</span>' +
        '<input class="form-control tip-input" type="number" min="0" value="' + v + '" />' +
        '<span class="unit">吨</span></div>';
    }
    box.innerHTML = html;
  }

  document.getElementById('mScope').addEventListener('change', syncScopeFields);
  document.getElementById('mTipOn').addEventListener('change', syncTipFields);
  document.getElementById('mForceOn').addEventListener('change', syncForceFields);
  document.getElementById('mTipCount').addEventListener('change', function () {
    var vals = Array.prototype.map.call(document.querySelectorAll('.tip-input'), function (el) {
      return el.value === '' ? '' : Number(el.value);
    });
    rebuildTipRows(this.value, vals);
  });

  function openEdit(row) {
    editId = row ? row.id : null;
    document.getElementById('editTitle').textContent = row ? '编辑' : '新增';
    document.getElementById('mScope').value = row ? row.scope : '';
    document.getElementById('mSite').value = row && row.scope === '分拨' ? row.site : '';
    document.getElementById('mOpType').value = row ? row.opType : '';
    Array.prototype.forEach.call(document.querySelectorAll('#mTypes input'), function (cb) {
      cb.checked = row && row.scope === '全国' ? row.types.indexOf(cb.value) >= 0 : false;
    });
    rebuildTipRows(row && row.tipOn === '是' ? row.tipCount : 3, row && row.tipOn === '是' ? row.tips : [5, 3, 1]);
    document.getElementById('mTipOn').value = row ? row.tipOn : '否';
    document.getElementById('mForceOn').value = row ? row.forceOn : '否';
    document.getElementById('mForcePct').value = row && row.forcePct !== '' ? row.forcePct : '';
    document.getElementById('mForceTon').value = row && row.forceTon !== '' && row.forceTon !== null ? row.forceTon : '';
    syncScopeFields();
    syncTipFields();
    syncForceFields();
    document.getElementById('editMask').classList.add('open');
  }

  function closeEdit() {
    document.getElementById('editMask').classList.remove('open');
  }

  function selectedIds() {
    return Array.prototype.map.call(document.querySelectorAll('#tableBody tr'), function (tr) {
      var cb = tr.querySelector('.row-check');
      return cb && cb.checked ? Number(tr.getAttribute('data-id')) : null;
    }).filter(function (x) { return x != null; });
  }

  document.getElementById('btnAdd').addEventListener('click', function () { openEdit(null); });
  document.getElementById('btnEdit').addEventListener('click', function () {
    var ids = selectedIds();
    if (ids.length !== 1) { alert('请勾选一条配置再编辑'); return; }
    var row = rows.find(function (r) { return r.id === ids[0]; });
    openEdit(row);
  });
  document.getElementById('btnDelete').addEventListener('click', function () {
    var ids = selectedIds();
    if (!ids.length) { alert('请至少勾选一条配置'); return; }
    document.getElementById('delText').textContent = '确认删除选中的 ' + ids.length + ' 条配置吗？';
    document.getElementById('delMask').dataset.ids = ids.join(',');
    document.getElementById('delMask').classList.add('open');
  });

  document.getElementById('editClose').addEventListener('click', closeEdit);
  document.getElementById('editCancel').addEventListener('click', closeEdit);
  document.getElementById('editOk').addEventListener('click', closeEdit);

  document.getElementById('delClose').addEventListener('click', function () {
    document.getElementById('delMask').classList.remove('open');
  });
  document.getElementById('delCancel').addEventListener('click', function () {
    document.getElementById('delMask').classList.remove('open');
  });
  document.getElementById('delOk').addEventListener('click', function () {
    var ids = (document.getElementById('delMask').dataset.ids || '').split(',').map(Number);
    rows = rows.filter(function (r) { return ids.indexOf(r.id) < 0; });
    document.getElementById('delMask').classList.remove('open');
    applyFilter();
  });

  applyFilter();
</script>

</body>
</html>
